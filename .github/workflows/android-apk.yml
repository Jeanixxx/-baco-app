name: Build Android APK

on:
  push:
    branches:
      - main
      - agent/android-kotlin-wrapper
      - feature/android-updates-signing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      # Solo una bandera (verdadero/falso): el contexto `secrets` no se puede usar en `if` de un paso.
      HAS_RELEASE_KEY: ${{ secrets.ABACO_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      # Gradle 8.10.2 se guarda en caché: solo se descarga la primera vez (o si la caché expira).
      # La descarga reintenta con espera creciente, porque services.gradle.org devuelve 504 a veces.
      - name: Restore Gradle 8.10.2 from cache
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.10.2
          key: gradle-8.10.2-linux

      - name: Set up Gradle 8.10.2
        shell: bash
        run: |
          set -uo pipefail
          DIR="${{ runner.temp }}/gradle-8.10.2"
          if [ ! -x "$DIR/bin/gradle" ]; then
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 30 -o "${{ runner.temp }}/gradle.zip" https://services.gradle.org/distributions/gradle-8.10.2-bin.zip; then
                ok=1; break
              fi
              echo "Descarga de Gradle falló (intento $i); espero $((i * 15)) s"
              sleep $((i * 15))
            done
            if [ "$ok" != 1 ]; then echo "::error::No se pudo descargar Gradle 8.10.2"; exit 1; fi
            unzip -q "${{ runner.temp }}/gradle.zip" -d "${{ runner.temp }}"
          fi
          echo "$DIR/bin" >> "$GITHUB_PATH"
          "$DIR/bin/gradle" --version

      - name: Build debug APK with increasing version
        run: gradle --no-daemon :app:assembleDebug -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }}

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: abaco-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Warn when release signing is not configured
        if: ${{ env.HAS_RELEASE_KEY != 'true' }}
        run: |
          echo "::warning::Sin secretos de firma: no se genera el APK de release. Usa solo el APK firmado con la clave persistente para actualizar Ábaco."

      - name: Prepare persistent release signing key
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        shell: bash
        env:
          ABACO_RELEASE_KEYSTORE_BASE64: ${{ secrets.ABACO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/abaco-release-key.jks"
          printf '%s' "$ABACO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ABACO_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK with persistent signature
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          ABACO_RELEASE_STORE_PASSWORD: ${{ secrets.ABACO_RELEASE_STORE_PASSWORD }}
          ABACO_RELEASE_KEY_ALIAS: ${{ secrets.ABACO_RELEASE_KEY_ALIAS }}
          ABACO_RELEASE_KEY_PASSWORD: ${{ secrets.ABACO_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }}

      - name: Publish release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: abaco-android-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
