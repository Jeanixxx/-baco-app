name: Build iOS App

on:
  push:
    branches:
      - main
      - agent/android-kotlin-wrapper
      - feature/month-for-you-carousel
      - feature/stitch-interface-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare bundled web app
        run: |
          mkdir -p ios/Abaco/Resources
          cp Abaco_Gestor_Finanzas.html ios/Abaco/Resources/index.html
          cd ios
          xcodegen generate --spec project.yml

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/Abaco.xcodeproj \
            -scheme Abaco \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/simulator/Build/Products/Release-iphonesimulator/Abaco.app \
            build/ios/Abaco-iphone-simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: abaco-iphone-simulator
          path: build/ios/Abaco-iphone-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Check for Apple signing configuration
        id: signing-config
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ] \
            && [ -n "$IOS_CERTIFICATE_PASSWORD" ] \
            && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] \
            && [ -n "$IOS_TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing assets
        if: steps.signing-config.outputs.available == 'true'
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-provisioning-profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/abaco-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile-uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Archive signed iPhone app
        if: steps.signing-config.outputs.available == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
        run: |
          xcodebuild archive \
            -project ios/Abaco.xcodeproj \
            -scheme Abaco \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Abaco.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>mx.abaco.app</key><string>$PROFILE_UUID</string></dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Abaco.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: steps.signing-config.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abaco-iphone-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Explain unsigned build
        if: steps.signing-config.outputs.available != 'true'
        run: echo "Simulator artifact created. Add the documented Apple signing secrets to export an installable IPA."
